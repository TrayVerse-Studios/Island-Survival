name: Build Cross-Platform IslandSurvival

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: IslandSurvival-Windows
            build_cmd: pyinstaller --add-data "IslandSurvivallogo.png;." --name "IslandSurvival" --noconfirm --windowed island_survival.py
          - os: macos-latest
            artifact_name: IslandSurvival-macOS
            build_cmd: pyinstaller --add-data "IslandSurvivallogo.png:." --name "IslandSurvival" --noconfirm --windowed island_survival.py
          - os: ubuntu-latest
            artifact_name: IslandSurvival-Linux
            build_cmd: pyinstaller --add-data "IslandSurvivallogo.png:." --name "IslandSurvival" --noconfirm island_survival.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Application with PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          retention-days: 5
